# Machine-readable field list for the extraction workbook.
# Companion to codebook.md v2.0-draft — that file holds the decision rules;
# this one holds the names, types and allowed values so that the table- and
# figure-generating scripts can validate the workbook instead of trusting it.
#
# Conventions
#   nr_allowed / na_allowed : whether "NR" / "NA" are legal values for the field
#   source_required         : a <field>_source locator must be filled in
#   in_paper                : the definition must appear in the manuscript
#   multi                   : the field is multi-label (list)

codebook_version: "2.0-draft"
unit_count_expected: 39
missing_codes:
  NR: "applies to this study but is not reported, or is too vague to code"
  NA: "does not conceptually apply to this study design"

fields:

  # --- identity and chronology ----------------------------------------------
  unit_id:              {type: string, source_required: false}
  reports:              {type: list,   source_required: false}
  title:                {type: string, source_required: false}
  authors:              {type: string, source_required: false}
  first_disclosure_year: {type: integer, source_required: true}
  venue_name:           {type: string, source_required: false,
                         note: "journal or conference name, never the publisher"}
  venue_type:           {type: enum, values: [journal, conference, conference proceedings, preprint]}
  peer_reviewed:        {type: enum, values: [yes, no]}

  # --- operational classification -------------------------------------------
  primary_class:
    type: enum
    in_paper: true
    source_required: true
    values: [quantum_native, hybrid_denoiser, quantum_latent,
             quantum_noise_driven, circuit_param_synthesis, theory_foundations]
    decided_by: "precedence rules R1-R6 (codebook.md 4.2), applied in order"
  primary_class_rule_fired:
    type: enum
    values: [R1, R2, R3, R4, R5, R6]
    note: "which rule assigned the class; makes the assignment auditable"
  secondary_descriptors:
    type: enum
    multi: true
    values: [conditional, score_based, latent, measurement_based, open_system,
             continuous_variable, hardware_oriented, theoretical]

  # --- generative objective --------------------------------------------------
  generative_objective:
    type: enum
    in_paper: true
    source_required: true
    values: [state_generation, distribution_learning, state_restoration,
             classical_data_generation, circuit_synthesis, theoretical]
    note: "the objective the headline claim rests on"
  secondary_objectives:
    type: enum
    multi: true
    values: [state_generation, distribution_learning, state_restoration,
             classical_data_generation, circuit_synthesis]

  # --- technical design ------------------------------------------------------
  diffusion_mechanism:  {type: string, source_required: true}
  quantum_role:         {type: string, source_required: true}
  generated_object:     {type: string, source_required: true}
  dataset_or_target:    {type: string, source_required: true, na_allowed: true}
  input_interface:      {type: enum, multi: true, nr_allowed: true, na_allowed: true,
                         values: [amplitude_encoding, angle_rotation_encoding,
                                  native_quantum_state, basis_position_encoding,
                                  data_reuploading, phase_encoding,
                                  quantum_autoencoder_vq_latent]}
  readout_strategy:     {type: enum, multi: true, nr_allowed: true, na_allowed: true,
                         values: [computational_z_basis_sampling, pauli_z_expectation,
                                  pauli_x_expectation, full_state_statevector_tomography,
                                  ancilla_projective_basis_unspecified,
                                  randomized_pauli, nonlocal_hadamard_test,
                                  measured_basis_unspecified]}

  # --- experimental scale (one field per qubit role; never summed) -----------
  qubits_generator_sim:
    type: integer
    in_paper: true
    nr_allowed: true
    na_allowed: true
    source_required: true
    feeds: "scale synthesis (simulation series)"
  qubits_generator_hw:
    type: integer
    in_paper: true
    nr_allowed: true
    na_allowed: true
    source_required: true
    feeds: "scale synthesis (hardware series)"
  qubits_ancilla:       {type: integer, nr_allowed: true, na_allowed: true, source_required: true}
  qubits_target_circuit: {type: integer, nr_allowed: true, na_allowed: true, source_required: true}
  qubits_downstream_eval: {type: integer, nr_allowed: true, na_allowed: true, source_required: true}
  qubits_range:         {type: string, nr_allowed: true, na_allowed: true}
  qubits_confirmed:
    type: enum
    values: [yes, no]
    note: "no = discussed as a scalability projection; excluded from the scale synthesis"

  # --- execution setting -----------------------------------------------------
  hardware_stage:
    type: enum
    multi: true
    in_paper: true
    na_allowed: true
    source_required: true
    values: [none, forward_on_device, training_in_loop, sampling, inference, post_training]
    note: "a noisy simulator or fake backend is 'none'"
  training_locus:
    type: enum
    in_paper: true
    na_allowed: true
    source_required: true
    values: [classical_simulation, hybrid_in_loop, end_to_end_hardware, not_trained]
    note: "hybrid_in_loop IS real hardware participation in training"
  simulator:            {type: string, nr_allowed: true, na_allowed: true}
  device:               {type: string, nr_allowed: true, na_allowed: true}
  noise_model:          {type: string, nr_allowed: true, na_allowed: true}
  shots:                {type: string, nr_allowed: true, na_allowed: true, source_required: true}
  shots_basis:          {type: string, nr_allowed: true, na_allowed: true,
                         note: "per circuit / per state / total"}
  depth:                {type: string, nr_allowed: true, na_allowed: true, source_required: true,
                         note: "in the unit the source uses; not standardised across studies"}
  circuit_evaluations_per_sample: {type: integer, nr_allowed: true, na_allowed: true}

  # --- evaluation and comparison ---------------------------------------------
  metrics:              {type: list, nr_allowed: true, source_required: true}
  metric_families:
    type: enum
    multi: true
    values: [image_quality, distributional_similarity, quantum_state_quality,
             task_performance, circuit_quality, uncertainty, computational_resources]
  training_objective_only:
    type: list
    note: "metrics reported only as training objectives, not as final evaluation"
  classical_baseline:
    type: enum
    values: [yes, no, na]
    source_required: true
    note: "resource mismatch is a limitation recorded separately, not a 'no'"
  baseline_resource_match: {type: string, nr_allowed: true, na_allowed: true}
  multiple_runs:
    type: enum
    values: [yes, no, na]
    source_required: true
    note: "shots, samples from one trained model and folds are NOT repetitions"
  uncertainty_reported: {type: enum, values: [yes, no, na], source_required: true}
  resource_claim_basis: {type: string, nr_allowed: true, na_allowed: true}

  # --- reproducibility --------------------------------------------------------
  public_code:
    type: enum
    values: [yes, no, na]
    source_required: true
    note: "an announced or planned release is 'no'"
  code_url:             {type: string, nr_allowed: true}
  public_data:          {type: enum, values: [yes, no, na]}

  # --- free text --------------------------------------------------------------
  notes:                {type: string}

# Fields whose definitions must be visible in the manuscript itself
# (Table 2 / Appendix B), because the headline claims rest on them.
in_paper_summary:
  - qubits_generator_sim
  - qubits_generator_hw
  - hardware_stage
  - training_locus
  - primary_class          # via precedence rules R1-R6
  - generative_objective
  - "NR vs NA convention"
